server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — все пути отдают index.html, Vue Router сам разрулит
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip для статики
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Кеш для иммутабельных ассетов (Vite добавляет hash в имена)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/* НЕ хендлим — это backend, к нему фронт сам ходит по своему домену
    # (либо CF tunnel настроен на molochko.elys.mom → backend)
}
