name: Build & push Docker images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR требует lowercase. github.repository_owner может быть с
      # заглавными (например DirtyDrowka) — приводим к нижнему регистру.
      - name: Compute lowercase image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$OWNER/elysmode-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/$OWNER/elysmode-frontend" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.backend }}:latest
            ${{ steps.img.outputs.backend }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.img.outputs.backend }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.backend }}:buildcache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.frontend }}:latest
            ${{ steps.img.outputs.frontend }}:${{ github.sha }}
          build-args: |
            VITE_OPENROUTER_KEY=${{ secrets.VITE_OPENROUTER_KEY }}
            VITE_OPENROUTER_MODEL=${{ vars.VITE_OPENROUTER_MODEL || 'x-ai/grok-4.3' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=registry,ref=${{ steps.img.outputs.frontend }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.frontend }}:buildcache,mode=max
