# Локальная разработка: поднимает только postgres.
# Backend и frontend запускаем напрямую через `npm run dev` (tsx + vite).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elysmode
      POSTGRES_PASSWORD: elysmode
      POSTGRES_DB: elysmode
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U elysmode']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev:
